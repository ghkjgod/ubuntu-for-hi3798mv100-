Section "Device"
    Identifier "Lima display"
    Driver "modesetting"
    Option "kmsdev" "/dev/dri/card0"
    Option "AccelMethod" "glamor"
    Option "SWcursor" "true"
EndSection
Section "Screen"
    Identifier "Lima screen"
    Device "Lima display"
EndSection
Section "ServerLayout"
    Identifier "Lima layout"
    Screen "Lima screen"
EndSection
